<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b6e4f">
<title>My Assistant</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root { --green:#0b6e4f; --dark:#1f2933; --bg:#f2f6f4; }
* { box-sizing:border-box; }
body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--dark); }
header { background:var(--green); color:#fff; padding:18px; text-align:center; }
header h2 { margin:0 0 5px; }
header p { margin:0; font-size:13px; }
main { max-width:650px; margin:auto; padding:15px; }
.status { background:#fff; border-radius:10px; padding:12px; font-size:13px; margin-bottom:12px; }
#chat { background:#fff; border-radius:14px; padding:14px; min-height:260px; max-height:48vh; overflow-y:auto; overflow-wrap:anywhere; }
.message { padding:10px 12px; border-radius:12px; margin:8px 0; white-space:pre-wrap; }
.user { background:#dcefe7; margin-left:12%; }
.assistant { background:#f0f1f2; margin-right:12%; }
input, button { width:100%; padding:13px; border-radius:10px; font-size:15px; margin-top:9px; font-family:inherit; }
input { border:1px solid #ccd5d0; background:#fff; }
button { border:none; background:var(--green); color:#fff; cursor:pointer; }
button.secondary { background:#fff; color:var(--green); border:1px solid var(--green); }
button:disabled { opacity:.6; }
.row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.small { font-size:12px; color:#59645e; line-height:1.6; }
</style>
</head>
<body>

<header>
  <h2>My Assistant 🎙️</h2>
  <p>তোমার ব্যক্তিগত সহকারী</p>
</header>

<main>
  <div class="status" id="status">Supabase প্রস্তুত হচ্ছে...</div>

  <div id="chat" aria-live="polite">
    <div class="message assistant">হ্যালো! আমি তোমার ব্যক্তিগত সহকারী। কিছু মনে রাখাতে চাইলে লেখো: "মনে রাখো ..."</div>
  </div>

  <input id="msg" type="text" placeholder="এখানে লিখে মেসেজ পাঠাও..." autocomplete="off">
  <button id="sendBtn" type="button">মেসেজ পাঠাও</button>
  <button class="secondary" type="button" id="voiceBtn">🎙️ কথা বলে মেসেজ দাও</button>

  <div class="row">
    <button class="secondary" type="button" id="memBtn">🧠 স্মৃতি দেখো</button>
    <button class="secondary" type="button" id="ttsBtn">🔊 কণ্ঠ পরীক্ষা</button>
  </div>
  <button class="secondary" type="button" id="clearBtn">🗑️ সব স্মৃতি মুছো</button>

  <p class="small">স্মৃতি Supabase-এর <b>memories</b> টেবিলে সংরক্ষিত হয়। টেবিল না থাকলে সাময়িকভাবে এই ব্রাউজারে সংরক্ষিত হবে।</p>
</main>

<script>
"use strict";

const SUPABASE_URL = "https://wftlnzhyvbhmhemqvryh.supabase.co";
const SUPABASE_KEY = "sb_publishable_kKya52PtdbcqZIB1kvvHGg_vTc4CeNK";
const LOCAL_KEY = "my_assistant_memory_v2";

const $ = id => document.getElementById(id);
let db = null;

/* ---------- Supabase ---------- */
try {
  if (window.supabase) {
    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    $("status").textContent = "✅ Supabase সংযুক্ত হয়েছে।";
  } else {
    $("status").textContent = "⚠️ Supabase লাইব্রেরি লোড হয়নি। ইন্টারনেট পরীক্ষা করো।";
  }
} catch (e) {
  $("status").textContent = "⚠️ Supabase সেটআপে সমস্যা: " + e.message;
}

/* ---------- Chat UI ---------- */
function addMessage(who, text) {
  const div = document.createElement("div");
  div.className = "message " + (who === "তুমি" ? "user" : "assistant");
  div.textContent = who + ": " + text;
  $("chat").appendChild(div);
  $("chat").scrollTop = $("chat").scrollHeight;
}

/* ---------- Memory (Supabase, fallback local) ---------- */
function localGet() {
  try {
    const v = JSON.parse(localStorage.getItem(LOCAL_KEY) || "[]");
    return Array.isArray(v) ? v : [];
  } catch { return []; }
}
function localSet(list) {
  try { localStorage.setItem(LOCAL_KEY, JSON.stringify(list)); } catch {}
}

async function saveMemory(text) {
  if (db) {
    const { error } = await db.from("memories").insert({ text });
    if (!error) return "cloud";
    console.error("memories insert:", error);
  }
  const list = localGet();
  list.push({ text, created_at: new Date().toISOString() });
  localSet(list);
  return "local";
}

async function loadMemories() {
  if (db) {
    const { data, error } = await db
      .from("memories").select("text,created_at")
      .order("created_at", { ascending: true }).limit(200);
    if (!error && data) return data;
    console.error("memories select:", error);
  }
  return localGet();
}

async function showMemory() {
  const list = await loadMemories();
  if (!list.length) { addMessage("Assistant", "এখনো কোনো তথ্য সংরক্ষণ করা হয়নি।"); return; }
  addMessage("Assistant", list.map((m, i) => (i + 1) + ". " + m.text).join("\n"));
}

async function clearMemory() {
  if (!confirm("সব সংরক্ষিত স্মৃতি মুছে ফেলবে?")) return;
  localStorage.removeItem(LOCAL_KEY);
  if (db) {
    const { error } = await db.from("memories").delete().not("id", "is", null);
    if (error) console.error("memories delete:", error);
  }
  addMessage("Assistant", "স্মৃতি মুছে ফেলা হয়েছে।");
}

/* ---------- Voice output ---------- */
function speak(text) {
  if (!("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "bn-BD";
  u.rate = 0.92;
  u.pitch = 1.1;
  const v = window.speechSynthesis.getVoices().find(x => /^bn([-_]|$)/i.test(x.lang));
  if (v) u.voice = v;
  window.speechSynthesis.speak(u);
}

/* ---------- Send ---------- */
let busy = false;

async function sendMessage() {
  if (busy) return;
  const text = $("msg").value.trim();
  if (!text) return;

  addMessage("তুমি", text);
  $("msg").value = "";
  busy = true;
  $("sendBtn").disabled = true;

  try {
    if (text.startsWith("মনে রাখো")) {
      const item = text.replace(/^মনে রাখো[\s:,-]*/, "").trim();
      if (!item) {
        addMessage("Assistant", "কী মনে রাখতে হবে, সেটি লিখে দাও।");
      } else {
        const where = await saveMemory(item);
        const r = where === "cloud"
          ? "মনে রাখলাম।"
          : "মনে রাখলাম, তবে শুধু এই ব্রাউজারে (Supabase টেবিল পাইনি)।";
        addMessage("Assistant", r);
        speak("মনে রাখলাম।");
      }
      return;
    }

    const memories = (await loadMemories()).map(m => m.text);

    const response = await fetch(SUPABASE_URL + "/functions/v1/amar-ai", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY
      },
      body: JSON.stringify({ message: text, memories })
    });

    let data = {};
    try { data = await response.json(); } catch {}

    if (!response.ok) {
      throw new Error(data.error || ("HTTP " + response.status));
    }

    const reply = data.answer || "উত্তর পাইনি।";
    addMessage("Assistant", reply);
    speak(reply);
  } catch (err) {
    console.error("AI error:", err);
    addMessage("Assistant", "দুঃখিত, AI-এর সঙ্গে সংযোগ করা যায়নি।\nকারণ: " + err.message);
  } finally {
    busy = false;
    $("sendBtn").disabled = false;
  }
}

/* ---------- Voice input ---------- */
function startVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert("এই ব্রাউজারে Voice Input নেই। Chrome ব্যবহার করো।"); return; }

  const rec = new SR();
  rec.lang = "bn-BD";
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  rec.onresult = e => { $("msg").value = e.results[0][0].transcript; sendMessage(); };
  rec.onerror = () => alert("কথা শনাক্ত করা যায়নি। মাইক্রোফোনের অনুমতি ও ইন্টারনেট পরীক্ষা করো।");
  try { rec.start(); } catch { alert("ভয়েস চালু করা যায়নি। আবার চেষ্টা করো।"); }
}

/* ---------- Wire up buttons ---------- */
$("sendBtn").addEventListener("click", sendMessage);
$("voiceBtn").addEventListener("click", startVoice);
$("memBtn").addEventListener("click", showMemory);
$("clearBtn").addEventListener("click", clearMemory);
$("ttsBtn").addEventListener("click", () => speak("হ্যালো! আমি তোমার ব্যক্তিগত অ্যাসিস্ট্যান্ট।"));
$("msg").addEventListener("keydown", e => { if (e.key === "Enter") sendMessage(); });
if ("speechSynthesis" in window) window.speechSynthesis.getVoices();
</script>
</body>
</html>
