*{

}

html,body{

  height:100%;
  margin:0;
  overflow:hidden;
}

body{

  min-height:0;

header{

}

}

.iconbtn{
  width:40px;
  height:40px;
  border-radius:50%;
  border:1px solid var(--line);
  background:transparent;
  color:var(--text);

  place-items:center;
  cursor:pointer;
  flex:none;
}

.iconbtn svg{

  height:20px;

  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.iconbtn.fill{

}

.iconbtn.rec{

}

.iconbtn:disabled{

}

#chat{

  min-height:0;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:14px;

.msg{
  max-width:86%;

  border-radius:14px;
  margin:10px 0;
  white-space:pre-wrap;

.msg .who{
  font-size:12px;
  font-weight:700;
  margin-bottom:3px;

}

.msg.me{

  border-bottom-right-radius:4px;
}

.msg.ai{
  background:var(--panel);

  margin-right:auto;
  border-bottom-left-radius:4px;
}

.acts{
  display:flex;
  gap:14px;
  align-items:center;
  margin-top:6px;
}

.spk{
  width:22px;
  height:22px;
  padding:0;
  border:0;
  background:transparent;
  color:var(--accent);
  cursor:pointer;
  display:grid;
  place-items:center;
}

.spk svg{
  width:18px;
  height:18px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.spk.loading{

.msg .del{

  border:0;
  background:transparent;
  color:inherit;

  font-size:11px;
  padding:0;
  cursor:pointer;

.note{

  color:var(--muted);
  border-radius:12px;
  padding:10px 12px;

.composer{

.bar{

<script>
"use strict";

/* =========================
   মোবাইল কিবোর্ড ও পর্দা
========================= */

function updateAppHeight(){
  const viewport = window.visualViewport;

  const height = viewport
    ? viewport.height
    : window.innerHeight;

  document.documentElement.style.setProperty(
    "--app-height",
    height + "px"
  );
}

updateAppHeight();

window.addEventListener("resize", updateAppHeight);

if(window.visualViewport){
  window.visualViewport.addEventListener(
    "resize",
    updateAppHeight
  );
}

/* =========================
   Supabase
========================= */

const SUPABASE_URL =
  "https://wftlnzhyvbhmhemqvryh.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_kKya52PtdbcqZIB1kvvHGg_vTc4CeNK";

const FN_URL =
  SUPABASE_URL + "/functions/v1/clever-api";

const LS_MSGS = "adhiba_msgs_v1";
const LS_CHAT = "adhiba_chat_v1";
const LS_MEM = "adhiba_mem_v1";
const LS_VOICE = "adhiba_voice_v1";

const $ = id => document.getElementById(id);

const ls = {
  get(k,d){
    try{
      const v = localStorage.getItem(k);
      return v === null ? d : JSON.parse(v);
    }catch{
      return d;
    }
  },

  set(k,v){
    try{
      localStorage.setItem(k,JSON.stringify(v));
    }catch{}
  }
};

const newId = () =>
  (window.crypto && crypto.randomUUID)
    ? crypto.randomUUID()
    : Date.now()+"-"+Math.random().toString(16).slice(2);

let db = null;

try{
  if(window.supabase){
    db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );
  }
}catch(e){
  console.error(e);
}

let cloud = !!db;

// অ্যাপ খুললেই নতুন চ্যাট শুরু হবে।
// আগের চ্যাট ইতিহাসে সেভ থাকবে।
let chatId = newId();

ls.set(LS_CHAT,chatId);

let current = [];
let busy = false;
let selectedImage = null;

/* =========================
   মেসেজ সংরক্ষণ
========================= */

async function insertMsg(role,content){
  const row = {
    chat_id:chatId,
    role,
    content
  };

  if(cloud){
    try{
      const {data,error} = await db
        .from("chat_messages")
        .insert(row)
        .select()
        .single();

      if(!error && data){
        return data;
      }

      console.error(error);
    }catch(e){
      console.error(e);
    }

    cloud = false;
  }

  const r = {
    ...row,
    id:"l"+Date.now()+Math.random().toString(16).slice(2),
    created_at:new Date().toISOString()
  };

  const all = ls.get(LS_MSGS,[]);
  all.push(r);
  ls.set(LS_MSGS,all);

  return r;
}

async function getAllMsgs(){
  let out = [];

  if(cloud){
    try{
      const {data,error} = await db
        .from("chat_messages")
        .select("*")
        .order("created_at",{ascending:true})
        .limit(3000);

      if(!error && data){
        out = data;
      }else{
        cloud = false;
      }
    }catch{
      cloud = false;
    }
  }

  const local = ls.get(LS_MSGS,[]);
  const ids = new Set(out.map(m=>String(m.id)));

  const uniqueLocal = local.filter(
    m=>!ids.has(String(m.id))
  );

  return out.concat(uniqueLocal).sort(
    (a,b)=>a.created_at.localeCompare(b.created_at)
  );
}

async function getMsgs(cid){
  return (await getAllMsgs()).filter(
    m=>m.chat_id===cid
  );
}

async function deleteMsg(id){
  if(String(id).startsWith("l")){
    ls.set(
      LS_MSGS,
      ls.get(LS_MSGS,[]).filter(m=>m.id!==id)
    );
    return;
  }

  if(db){
    try{
      await db.from("chat_messages").delete().eq("id",id);
    }catch(e){
      console.error(e);
    }
  }
}

async function deleteChat(cid){
  ls.set(
    LS_MSGS,
    ls.get(LS_MSGS,[]).filter(m=>m.chat_id!==cid)
  );

  if(db){
    try{
      await db.from("chat_messages").delete().eq("chat_id",cid);
    }catch(e){
      console.error(e);
    }
  }
}

async function deleteAllChats(){
  ls.set(LS_MSGS,[]);

  if(db){
    try{
      await db.from("chat_messages").delete().not("id","is",null);
    }catch(e){
      console.error(e);
    }
  }
}

/* =========================
   স্মৃতি
========================= */

async function saveMem(text){
  if(db){
    try{
      const {error} = await db
        .from("memories")
        .insert({text});

      if(!error){
        return true;
      }

      console.error(error);
    }catch(e){
      console.error(e);
    }
  }

  const l = ls.get(LS_MEM,[]);
  l.push({
    text,
    created_at:new Date().toISOString()
  });

  ls.set(LS_MEM,l);

  return false;
}

async function getMems(){
  let out = [];

  if(db){
    try{
      const {data,error} = await db
        .from("memories")
        .select("text,created_at")
        .order("created_at",{ascending:true})
        .limit(200);

      if(!error && data){
        out = data;
      }
    }catch{}
  }

  return out.concat(ls.get(LS_MEM,[]));
}

async function clearMems(){
  ls.set(LS_MEM,[]);

  if(db){
    try{
      await db.from("memories").delete().not("id","is",null);
    }catch{}
  }
}

/* =========================
   চ্যাট দেখানো
========================= */

function scrollDown(){
  const c = $("chat");
  c.scrollTop = c.scrollHeight;
}

function note(text){
  const d = document.createElement("div");
  d.className = "note";
  d.textContent = text;

  $("chat").appendChild(d);
  scrollDown();

  return d;
}

function bubble(m){
  const welcome = $("welcome");
  if(welcome) welcome.remove();

  const d = document.createElement("div");

  d.className =
    "msg " + (m.role==="user" ? "me" : "ai");

  const who = document.createElement("div");
  who.className = "who";
  who.textContent = m.role==="user" ? "আমি" : "আধিবা";

  const t = document.createElement("div");
  t.textContent = m.content;

  const acts = document.createElement("div");
  acts.className = "acts";

  if(m.role!=="user"){
    const sp = document.createElement("button");

    sp.type = "button";
    sp.className = "spk";
    sp.setAttribute("aria-label","শুনুন");

    sp.innerHTML =
      '<svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4zM15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';

    sp.onclick = () => playVoice(m.id,m.content,sp);

    acts.append(sp);
  }

  const x = document.createElement("button");

  x.type = "button";
  x.className = "del";
  x.textContent = "মুছো";

  x.onclick = async()=>{
    if(!confirm("এই মেসেজটি মুছবে?")) return;

    await deleteMsg(m.id);

    current = current.filter(c=>c.id!==m.id);
    d.remove();
  };

  acts.append(x);

  d.append(who,t,acts);

  $("chat").appendChild(d);

  scrollDown();
}

function renderChat(){
  $("chat").textContent = "";

  if(!current.length){
    const n = note(
      'হ্যালো! আমি আধিবা। কিছু মনে রাখতে চাইলে লেখো: "মনে রাখো ..."'
    );

    n.id = "welcome";
  }else{
    current.forEach(bubble);
  }
}

/* =========================
   WAV তৈরি (শব্দ কাটার ক্লিক এড়াতে)
========================= */

function makeWavBytes(samples,rate){
  const n = samples.length * 2;

  const buf = new ArrayBuffer(44+n);
  const v = new DataView(buf);

  const writeString = (o,s)=>{
    for(let i=0;i<s.length;i++){
      v.setUint8(o+i,s.charCodeAt(i));
    }
  };

  writeString(0,"RIFF");
  v.setUint32(4,36+n,true);
  writeString(8,"WAVE");
  writeString(12,"fmt ");

  v.setUint32(16,16,true);
  v.setUint16(20,1,true);
  v.setUint16(22,1,true);

  v.setUint32(24,rate,true);
  v.setUint32(28,rate*2,true);

  v.setUint16(32,2,true);
  v.setUint16(34,16,true);

  writeString(36,"data");
  v.setUint32(40,n,true);

  for(let i=0;i<samples.length;i++){
    v.setInt16(44+i*2,samples[i],true);
  }

  return new Uint8Array(buf);
}

function bytesToBase64(bytes){
  let bin = "";
  const chunk = 0x8000;

  for(let i=0;i<bytes.length;i+=chunk){
    bin += String.fromCharCode.apply(
      null,
      bytes.subarray(i,i+chunk)
    );
  }

  return btoa(bin);
}

/* =========================

const VOICES = [

  {id:"Kore",name:"কোরে (দৃঢ়)"}
];

function getVoice(){
  const saved = ls.get(LS_VOICE,"Leda");
  return VOICES.some(v=>v.id===saved) ? saved : "Leda";
}

let audioEl = null;
const audioCache = new Map();

// শব্দ বাজানোর আগে চিহ্ন (*, #) সরানো, যাতে পড়ে না ফেলে
function cleanForSpeech(text){
  return String(text)
    .replace(/[*#_`>~]+/g,"")
    .replace(/\s+/g," ")
    .trim();
}

function pcmToWavUrl(b64){
  const bin = atob(b64);

  const bytes = new Uint8Array(bin.length);

  for(let i=0;i<bin.length;i++){
    bytes[i] = bin.charCodeAt(i);
  }

  const rate = 24000;

  const count = Math.floor(bytes.length/2);
  const pcm = new Int16Array(count);

  const dv = new DataView(bytes.buffer);

  for(let i=0;i<count;i++){
    pcm[i] = dv.getInt16(i*2,true);
  }

  // শুরুতে ১০ms ফেড-ইন, শেষে ৫০ms ফেড-আউট
  const fadeIn = Math.min(count,Math.floor(rate*0.01));
  const fadeOut = Math.min(count,Math.floor(rate*0.05));

  for(let i=0;i<fadeIn;i++){
    pcm[i] = Math.round(pcm[i]*(i/fadeIn));
  }

  for(let i=0;i<fadeOut;i++){
    const idx = count-1-i;
    pcm[idx] = Math.round(pcm[idx]*(i/fadeOut));
  }

  // শেষে ২০০ms নীরবতা, যাতে হঠাৎ কেটে "টিক" শব্দ না হয়
  const tail = Math.floor(rate*0.2);

  const out = new Int16Array(count+tail);
  out.set(pcm,0);

  return URL.createObjectURL(
    new Blob([makeWavBytes(out,rate)],{type:"audio/wav"})
  );
}

async function playVoice(key,text,btn){
  if(audioEl){
    audioEl.pause();
    audioEl = null;
  }

  btn.classList.add("loading");

  try{
    const voice = getVoice();
    const cacheKey = key+"|"+voice;

    let url = audioCache.get(cacheKey);

    if(!url){
      const res = await fetch(FN_URL,{
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer "+SUPABASE_KEY
        },
        body:JSON.stringify({
          tts:true,
          text:cleanForSpeech(text),
          voice
        })
      });

      let data = {};

      try{
        data = await res.json();
      }catch{}

      if(!res.ok){
        throw new Error(
          data.error || ("HTTP "+res.status)
        );
      }

      url = pcmToWavUrl(data.audio);

      audioCache.set(cacheKey,url);
    }

    audioEl = new Audio(url);

    await audioEl.play();

  }catch(e){
    note("কণ্ঠ চালানো যায়নি।\nকারণ: "+e.message);
  }finally{
    btn.classList.remove("loading");
  }
}

$("imageBtn").addEventListener(
  "click",
  ()=>$("imageInput").click()

$("imageInput").addEventListener("change",async()=>{
  const file =
    $("imageInput").files &&
    $("imageInput").files[0];

  if(!file) return;

  if(!file.type.startsWith("image/")){
    alert("একটি ছবি নির্বাচন করো।");
    $("imageInput").value="";
    return;
  }

  if(file.size>10*1024*1024){
    alert("ছবিটি ১০ MB-এর বেশি। ছোট ছবি নির্বাচন করো।");
    $("imageInput").value="";
    return;
  }

  try{
    const data = await new Promise((resolve,reject)=>{
      const reader = new FileReader();

      reader.onload = ()=>{
        resolve(
          String(reader.result).split(",")[1]
        );
      };

      reader.onerror = reject;

      reader.readAsDataURL(file);
    });

    selectedImage = {
      mimeType:file.type,
      data,
      name:file.name
    };

    $("previewImg").src = URL.createObjectURL(file);
    $("previewName").textContent = file.name;
    $("imagePreview").classList.add("show");

  }catch{
    alert("ছবিটি পড়া যায়নি। আবার চেষ্টা করো।");
  }
});

function removeSelectedImage(){
  selectedImage = null;

  $("imageInput").value = "";
  $("previewImg").removeAttribute("src");
  $("previewName").textContent = "";
  $("imagePreview").classList.remove("show");
}

$("removeImage").addEventListener(

/* =========================
   উত্তর সংরক্ষণ
========================= */

async function reply(text){
  const am = await insertMsg("assistant",text);

  current.push(am);

  bubble(am);
}

/* =========================
   প্রশ্ন পাঠানো
========================= */

async function send(){
  if(busy) return;

  const text = $("msg").value.trim();

  if(!text && !selectedImage) return;

  const imageToSend = selectedImage;

  const displayText =
    text +
    (imageToSend
      ? "\n[ছবি: "+imageToSend.name+"]"
      : "");

  $("msg").value = "";

  busy = true;
  $("send").disabled = true;

  try{
    const um = await insertMsg("user",displayText);

    current.push(um);

    bubble(um);

    // স্মৃতি সংরক্ষণ
    if(text.startsWith("মনে রাখো") && !imageToSend){
      const item = text
        .replace(/^মনে রাখো[\s:,-]*/,"")
        .trim();

      if(!item){
        await reply("কী মনে রাখতে হবে, লিখে দাও।");
        return;
      }

      const ok = await saveMem(item);

      await reply(
        ok
          ? "মনে রাখলাম।"
          : "মনে রাখলাম (শুধু এই ব্রাউজারে)।"
      );

      return;
    }

    const wait = note("ভাবছি...");

    try{
      const mems = (await getMems()).map(m=>m.text);

      const ctx = current
        .slice(-13,-1)
        .map(m=>
          (m.role==="user" ? "আমি: " : "আধিবা: ") +
          m.content
        );

      const memories = [
        "তোমার নাম আধিবা।",
        ...mems,
        ...(ctx.length
          ? ["এই চ্যাটের আগের কথোপকথন:",...ctx]
          : [])
      ];

      const payload = {
        message:
          text ||
          "এই ছবিটি দেখে আমাকে বলো কী আছে।",
        memories
      };

      if(imageToSend){
        payload.image = imageToSend;
      }

      const res = await fetch(FN_URL,{
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer "+SUPABASE_KEY
        },
        body:JSON.stringify(payload)
      });

      let data = {};

      try{
        data = await res.json();
      }catch{}

      if(!res.ok){
        throw new Error(
          data.error || ("HTTP "+res.status)
        );
      }

      wait.remove();

      await reply(data.answer || "উত্তর পাইনি।");

      if(imageToSend){
        removeSelectedImage();
      }

    }catch(e){
      wait.remove();

      note(
        "দুঃখিত, সংযোগ করা যায়নি।\nকারণ: "+
        e.message
      );
    }

  }finally{
    busy = false;
    $("send").disabled = false;
  }
}

/* =========================
   মাইক্রোফোন (বিপ ছাড়া)
   ফোনের নিজস্ব SpeechRecognition "টিট" শব্দ করে।
   তাই এখানে নিজেই রেকর্ড করে Gemini দিয়ে লেখা বানানো হয়।
========================= */

let recState = null;

async function blobToWavBase64(blob){
  const buf = await blob.arrayBuffer();

  const AC = window.AudioContext || window.webkitAudioContext;
  const ctx = new AC();

  let decoded;

  try{
    decoded = await ctx.decodeAudioData(buf);
  }finally{
    ctx.close();
  }

  const frames = Math.max(1,Math.ceil(decoded.duration*16000));

  const off = new OfflineAudioContext(1,frames,16000);

  const src = off.createBufferSource();
  src.buffer = decoded;
  src.connect(off.destination);
  src.start();

  const rendered = await off.startRendering();

  const f32 = rendered.getChannelData(0);
  const pcm = new Int16Array(f32.length);

  for(let i=0;i<f32.length;i++){
    const s = Math.max(-1,Math.min(1,f32[i]));
    pcm[i] = s<0 ? s*0x8000 : s*0x7fff;
  }

  return bytesToBase64(makeWavBytes(pcm,16000));
}

async function transcribeAndSend(blob){
  const wait = note("শুনছি...");

  try{
    if(!blob.size){
      throw new Error("কোনো শব্দ রেকর্ড হয়নি।");
    }

    const b64 = await blobToWavBase64(blob);

    const res = await fetch(FN_URL,{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "apikey":SUPABASE_KEY,
        "Authorization":"Bearer "+SUPABASE_KEY
      },
      body:JSON.stringify({
        stt:true,
        audio:{
          mimeType:"audio/wav",
          data:b64
        }
      })
    });

    let data = {};

    try{
      data = await res.json();
    }catch{}

    if(!res.ok){
      throw new Error(
        data.error || ("HTTP "+res.status)
      );
    }

    wait.remove();

    const heard = String(data.text || "").trim();

    if(!heard){
      note("কিছু শোনা যায়নি। আবার বলো।");
      return;
    }

    $("msg").value = heard;

    send();

  }catch(e){
    wait.remove();

    note("কথা শনাক্ত করা যায়নি।\nকারণ: "+e.message);
  }
}

// পুরনো পদ্ধতি, শুধু রেকর্ডিং না চললে বিকল্প হিসেবে
function startVoiceFallback(){
  const SR =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SR){
    alert("এই ব্রাউজারে ভয়েস ইনপুট নেই। Chrome ব্যবহার করো।");
    return;
  }

  const rec = new SR();

  rec.lang = "bn-BD";
  rec.interimResults = false;
  rec.maxAlternatives = 1;

  rec.onresult = e=>{
    $("msg").value =
      e.results[0][0].transcript;

    send();
  };

  rec.onerror = ()=>{
    alert(
      "কথা শনাক্ত করা যায়নি। মাইক্রোফোনের অনুমতি ও ইন্টারনেট পরীক্ষা করো।"
    );
  };

  try{
    rec.start();
  }catch{
    alert("ভয়েস চালু করা যায়নি।");
  }
}

async function toggleMic(){
  if(busy) return;

  // রেকর্ড চলছে: থামাও
  if(recState){
    try{
      recState.rec.stop();
    }catch{}
    return;
  }

  if(!navigator.mediaDevices || !window.MediaRecorder){
    startVoiceFallback();
    return;
  }

  // আধিবার কণ্ঠ চলছে, আগে থামাও
  if(audioEl){
    audioEl.pause();
    audioEl = null;
  }

  let stream;

  try{
    stream = await navigator.mediaDevices.getUserMedia({audio:true});
  }catch{
    alert("মাইক্রোফোনের অনুমতি দাও।");
    return;
  }

  const chunks = [];
  const rec = new MediaRecorder(stream);

  rec.ondataavailable = e=>{
    if(e.data && e.data.size){
      chunks.push(e.data);
    }
  };

  rec.onstop = async()=>{
    stream.getTracks().forEach(t=>t.stop());

    recState = null;

    $("micBtn").classList.remove("rec");

    const blob = new Blob(
      chunks,
      {type:rec.mimeType || "audio/webm"}
    );

    await transcribeAndSend(blob);
  };

  recState = {rec};

  rec.start();

  $("micBtn").classList.add("rec");

  // ৬০ সেকেন্ড পর নিজে থেকে থামবে
  setTimeout(()=>{
    if(recState && recState.rec===rec && rec.state==="recording"){
      rec.stop();
    }
  },60000);
}

/* =========================
   ইতিহাস
========================= */

function closeHist(){
  $("hist").classList.remove("open");
}

async function newChat(){
  chatId = newId();

  ls.set(LS_CHAT,chatId);

  current = [];

  renderChat();

  closeHist();
}

async function openChat(cid){
  chatId = cid;

  ls.set(LS_CHAT,cid);

  current = await getMsgs(cid);

  renderChat();

  closeHist();
}

async function openHist(){
  $("hist").classList.add("open");

  const list = $("histList");

  list.textContent = "লোড হচ্ছে...";

  const all = await getAllMsgs();

  const map = {};

  all.forEach(m=>{
    const c = map[m.chat_id] ||
      (map[m.chat_id]={
        cid:m.chat_id,
        title:"",
        last:"",
        n:0
      });

    c.n++;

    if(!c.title && m.role==="user"){
      c.title = m.content;
    }

    if(m.created_at>c.last){
      c.last = m.created_at;
    }
  });

  const chats = Object.values(map).sort(
    (a,b)=>a.last<b.last ? 1 : -1
  );

  list.textContent = "";

  if(!chats.length){
    list.textContent = "এখনো কোনো ইতিহাস নেই।";
    return;
  }

  chats.forEach(c=>{
    const row = document.createElement("div");
    row.className = "row";

    const open = document.createElement("button");

    open.type = "button";
    open.className = "open";

    const t = document.createElement("div");
    t.className = "t";
    t.textContent = c.title || "নতুন চ্যাট";

    const d = document.createElement("div");
    d.className = "d";

    d.textContent =
      new Date(c.last).toLocaleDateString("bn-BD")+
      " · "+c.n+" মেসেজ";

    open.append(t,d);

    open.onclick = ()=>openChat(c.cid);

    const x = document.createElement("button");

    x.type = "button";
    x.className = "x";
    x.textContent = "মুছো";

    x.onclick = async()=>{
      if(!confirm("এই পুরো চ্যাটটি মুছবে?")) return;

      await deleteChat(c.cid);

      if(c.cid===chatId){
        chatId = newId();

        ls.set(LS_CHAT,chatId);

        current = [];

        renderChat();
      }

      openHist();
    };

    row.append(open,x);

    list.appendChild(row);
  });
}

/* =========================
   মেনু
========================= */

$("menuBtn").addEventListener("click",e=>{
  e.stopPropagation();

  $("menu").classList.toggle("open");
});

document.addEventListener("click",()=>{
  $("menu").classList.remove("open");
});

$("menu").addEventListener("click",async e=>{
  const act =
    e.target.dataset &&
    e.target.dataset.act;

  if(!act) return;

  $("menu").classList.remove("open");

  if(act==="new"){
    newChat();

  }else if(act==="hist"){
    openHist();

  }else if(act==="mem"){
    const l = await getMems();

    note(
      l.length
        ? "স্মৃতি:\n"+
          l.map((m,i)=>(i+1)+". "+m.text).join("\n")
        : "এখনো কোনো স্মৃতি নেই।"
    );

  }else if(act==="voice"){
    const idx = VOICES.findIndex(v=>v.id===getVoice());
    const next = VOICES[(idx+1)%VOICES.length];

    ls.set(LS_VOICE,next.id);

    note("কণ্ঠ বদলানো হয়েছে: "+next.name);

    playVoice(
      "test",
      "হ্যালো! আমি আধিবা, তোমার ব্যক্তিগত সহকারী।",
      document.createElement("button")
    );

  }else if(act==="tts"){
    playVoice(
      "test",
      "হ্যালো! আমি আধিবা, তোমার ব্যক্তিগত সহকারী।",
      document.createElement("button")
    );

  }else if(act==="clearMem"){
    if(confirm("সব স্মৃতি মুছে ফেলবে?")){
      await clearMems();
      note("স্মৃতি মুছে ফেলা হয়েছে।");
    }

  }else if(act==="clearAll"){
    if(confirm("সব চ্যাটের ইতিহাস মুছে ফেলবে?")){
      await deleteAllChats();

      chatId = newId();

      ls.set(LS_CHAT,chatId);

      current = [];

      renderChat();
    }
  }
});
