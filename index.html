<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d14">
<title>Adhiba</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#0a0d14;--panel:#111722;--line:#1f2937;--text:#e6edf6;--muted:#8b98a9;--accent:#4f8cff;--me:#a8d1ff;--meText:#0b1b33}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;display:flex;flex-direction:column;height:100dvh}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top,0px));background:var(--panel);border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:20px;letter-spacing:.5px}
header p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--text);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.iconbtn.fill{background:var(--accent);border-color:var(--accent);color:#fff}
.iconbtn:disabled{opacity:.5}
#chat{flex:1;overflow-y:auto;padding:14px;overflow-wrap:anywhere}
.msg{max-width:86%;padding:10px 12px;border-radius:14px;margin:10px 0;white-space:pre-wrap;line-height:1.55}
.msg .who{font-size:12px;font-weight:700;margin-bottom:3px;opacity:.75}
.msg.me{background:var(--me);color:var(--meText);margin-left:auto;border-bottom-right-radius:4px}
.msg.ai{background:var(--panel);border:1px solid var(--line);margin-right:auto;border-bottom-left-radius:4px}
.msg .del{display:block;margin-top:6px;border:0;background:transparent;color:inherit;opacity:.5;font-size:11px;padding:0;cursor:pointer}
.note{background:transparent;border:1px dashed var(--line);color:var(--muted);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px;white-space:pre-wrap}
.bar{display:flex;gap:8px;align-items:center;padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line)}
.bar input{flex:1;min-width:0;height:42px;border-radius:21px;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:0 16px;font-size:15px;font-family:inherit;outline:none}
.bar input:focus{border-color:var(--accent)}
#menu{position:absolute;right:12px;top:calc(60px + env(safe-area-inset-top,0px));background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:210px;padding:6px;display:none;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#menu.open{display:block}
#menu button{display:block;width:100%;text-align:left;background:transparent;border:0;color:var(--text);padding:11px 12px;border-radius:8px;font-size:14px;font-family:inherit;cursor:pointer}
#menu button:active{background:var(--line)}
#menu .danger{color:#f87171}
#hist{position:fixed;inset:0;background:var(--bg);z-index:30;display:none;flex-direction:column}
#hist.open{display:flex}
#hist .top{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top,0px));background:var(--panel);border-bottom:1px solid var(--line)}
#hist h2{margin:0;font-size:17px}
#histList{flex:1;overflow-y:auto;padding:12px}
.row{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.row .open{flex:1;min-width:0;text-align:left;background:transparent;border:0;color:var(--text);padding:12px;font-family:inherit;cursor:pointer}
.row .t{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .d{font-size:12px;color:var(--muted);margin-top:3px}
.row .x{background:transparent;border:0;color:#f87171;padding:12px;font-size:12px;cursor:pointer;font-family:inherit}
.newchat{margin:0 12px 4px;height:42px;border-radius:12px;border:0;background:var(--accent);color:#fff;font-size:15px;font-family:inherit;cursor:pointer}
</style>
</head>
<body>

<header>
  <div>
    <h1>Adhiba</h1>
    <p>তোমার ব্যক্তিগত সহকারী</p>
  </div>
  <button class="iconbtn" id="menuBtn" type="button" aria-label="মেনু">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="19" r="1.2"/></svg>
  </button>
</header>

<div id="menu">
  <button type="button" data-act="new">নতুন চ্যাট</button>
  <button type="button" data-act="hist">ইতিহাস</button>
  <button type="button" data-act="mem">স্মৃতি দেখো</button>
  <button type="button" data-act="voice" id="voiceItem">কণ্ঠ: চালু</button>
  <button type="button" data-act="tts">কণ্ঠ পরীক্ষা</button>
  <button type="button" data-act="clearMem" class="danger">সব স্মৃতি মুছো</button>
  <button type="button" data-act="clearAll" class="danger">সব ইতিহাস মুছো</button>
</div>

<div id="chat" aria-live="polite"></div>

<div class="bar">
  <input id="msg" type="text" placeholder="মেসেজ লেখো..." autocomplete="off">
  <button class="iconbtn" id="micBtn" type="button" aria-label="ভয়েস">
    <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
  </button>
  <button class="iconbtn fill" id="send" type="button" aria-label="পাঠাও">
    <svg viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg>
  </button>
</div>

<div id="hist">
  <div class="top">
    <h2>ইতিহাস</h2>
    <button class="iconbtn" id="histClose" type="button" aria-label="বন্ধ">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div style="padding-top:12px"><button class="newchat" id="histNew" type="button">+ নতুন চ্যাট</button></div>
  <div id="histList"></div>
</div>

<script>
"use strict";

const SUPABASE_URL = "https://wftlnzhyvbhmhemqvryh.supabase.co";
const SUPABASE_KEY = "sb_publishable_kKya52PtdbcqZIB1kvvHGg_vTc4CeNK";
const FN_URL = SUPABASE_URL + "/functions/v1/clever-api";
const LS_MSGS = "adhiba_msgs_v1", LS_CHAT = "adhiba_chat_v1", LS_MEM = "adhiba_mem_v1", LS_VOICE = "adhiba_voice_v1";

const $ = id => document.getElementById(id);
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const newId = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(16).slice(2);

let db = null;
try { if (window.supabase) db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch (e) { console.error(e); }
let cloud = !!db;

let chatId = ls.get(LS_CHAT, null) || newId();
ls.set(LS_CHAT, chatId);
let current = [];
let busy = false;
let voiceOn = ls.get(LS_VOICE, true);

/* ---------- Storage: messages ---------- */
async function insertMsg(role, content) {
  const row = { chat_id: chatId, role, content };
  if (cloud) {
    try {
      const { data, error } = await db.from("chat_messages").insert(row).select().single();
      if (!error && data) return data;
      console.error(error);
    } catch (e) { console.error(e); }
    cloud = false;
  }
  const r = { ...row, id: "l" + Date.now() + Math.random().toString(16).slice(2), created_at: new Date().toISOString() };
  const all = ls.get(LS_MSGS, []); all.push(r); ls.set(LS_MSGS, all);
  return r;
}

async function getAllMsgs() {
  let out = [];
  if (cloud) {
    try {
      const { data, error } = await db.from("chat_messages").select("*").order("created_at", { ascending: true }).limit(3000);
      if (!error && data) out = data; else cloud = false;
    } catch { cloud = false; }
  }
  return out.concat(ls.get(LS_MSGS, [])).sort((a, b) => (a.created_at < b.created_at ? -1 : 1));
}

async function getMsgs(cid) {
  return (await getAllMsgs()).filter(m => m.chat_id === cid);
}

async function deleteMsg(id) {
  if (String(id).startsWith("l")) {
    ls.set(LS_MSGS, ls.get(LS_MSGS, []).filter(m => m.id !== id));
    return;
  }
  try { await db.from("chat_messages").delete().eq("id", id); } catch (e) { console.error(e); }
}

async function deleteChat(cid) {
  ls.set(LS_MSGS, ls.get(LS_MSGS, []).filter(m => m.chat_id !== cid));
  if (db) { try { await db.from("chat_messages").delete().eq("chat_id", cid); } catch (e) { console.error(e); } }
}

async function deleteAllChats() {
  ls.set(LS_MSGS, []);
  if (db) { try { await db.from("chat_messages").delete().not("id", "is", null); } catch (e) { console.error(e); } }
}

/* ---------- Storage: memories ---------- */
async function saveMem(text) {
  if (db) {
    try {
      const { error } = await db.from("memories").insert({ text });
      if (!error) return true;
      console.error(error);
    } catch (e) { console.error(e); }
  }
  const l = ls.get(LS_MEM, []); l.push({ text, created_at: new Date().toISOString() }); ls.set(LS_MEM, l);
  return false;
}

async function getMems() {
  let out = [];
  if (db) {
    try {
      const { data, error } = await db.from("memories").select("text,created_at").order("created_at", { ascending: true }).limit(200);
      if (!error && data) out = data;
    } catch {}
  }
  return out.concat(ls.get(LS_MEM, []));
}

async function clearMems() {
  ls.set(LS_MEM, []);
  if (db) { try { await db.from("memories").delete().not("id", "is", null); } catch {} }
}

/* ---------- Chat UI ---------- */
function scrollDown() { const c = $("chat"); c.scrollTop = c.scrollHeight; }

function note(text) {
  const d = document.createElement("div");
  d.className = "note"; d.textContent = text;
  $("chat").appendChild(d); scrollDown();
  return d;
}

function bubble(m) {
  const w = $("welcome"); if (w) w.remove();
  const d = document.createElement("div");
  d.className = "msg " + (m.role === "user" ? "me" : "ai");
  const who = document.createElement("div"); who.className = "who"; who.textContent = m.role === "user" ? "আমি" : "আধিবা";
  const t = document.createElement("div"); t.textContent = m.content;
  const x = document.createElement("button"); x.type = "button"; x.className = "del"; x.textContent = "মুছো";
  x.onclick = async () => {
    if (!confirm("এই মেসেজটি মুছবে?")) return;
    await deleteMsg(m.id);
    current = current.filter(c => c.id !== m.id);
    d.remove();
  };
  d.append(who, t, x);
  $("chat").appendChild(d); scrollDown();
}

function renderChat() {
  $("chat").textContent = "";
  if (!current.length) {
    const n = note("হ্যালো! আমি আধিবা। কিছু মনে রাখাতে চাইলে লেখো: \"মনে রাখো ...\"");
    n.id = "welcome";
  } else {
    current.forEach(bubble);
  }
}

/* ---------- Voice output ---------- */
function pickVoice() {
  const vs = window.speechSynthesis.getVoices();
  const bn = vs.filter(v => /^bn([-_]|$)/i.test(v.lang));
  return bn.find(v => /female|nabanita|tanishaa|google/i.test(v.name)) || bn[0] || null;
}

function speak(text) {
  if (!voiceOn || !("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "bn-BD";
  u.rate = 0.93;
  u.pitch = 1.35;
  const v = pickVoice(); if (v) u.voice = v;
  window.speechSynthesis.speak(u);
}

/* ---------- Send ---------- */
async function reply(text) {
  const am = await insertMsg("assistant", text);
  current.push(am); bubble(am); speak(text);
}

async function send() {
  if (busy) return;
  const text = $("msg").value.trim();
  if (!text) return;
  $("msg").value = "";
  busy = true; $("send").disabled = true;

  try {
    const um = await insertMsg("user", text);
    current.push(um); bubble(um);

    if (text.startsWith("মনে রাখো")) {
      const item = text.replace(/^মনে রাখো[\s:,-]*/, "").trim();
      if (!item) { await reply("কী মনে রাখতে হবে, লিখে দাও।"); return; }
      const ok = await saveMem(item);
      await reply(ok ? "মনে রাখলাম।" : "মনে রাখলাম (শুধু এই ব্রাউজারে)।");
      return;
    }

    const wait = note("ভাবছি...");
    try {
      const mems = (await getMems()).map(m => m.text);
      const ctx = current.slice(-13, -1).map(m => (m.role === "user" ? "আমি: " : "আধিবা: ") + m.content);
      const memories = ["তোমার নাম আধিবা।"].concat(mems, ctx.length ? ["এই চ্যাটের আগের কথোপকথন:"].concat(ctx) : []);

      const res = await fetch(FN_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json", "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY },
        body: JSON.stringify({ message: text, memories })
      });
      let data = {};
      try { data = await res.json(); } catch {}
      if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));

      wait.remove();
      await reply(data.answer || "উত্তর পাইনি।");
    } catch (e) {
      wait.remove();
      note("দুঃখিত, সংযোগ করা যায়নি।\nকারণ: " + e.message);
    }
  } finally {
    busy = false; $("send").disabled = false;
  }
}

/* ---------- Voice input ---------- */
function startVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert("এই ব্রাউজারে ভয়েস ইনপুট নেই। Chrome ব্যবহার করো।"); return; }
  const rec = new SR();
  rec.lang = "bn-BD"; rec.interimResults = false; rec.maxAlternatives = 1;
  rec.onresult = e => { $("msg").value = e.results[0][0].transcript; send(); };
  rec.onerror = () => alert("কথা শনাক্ত করা যায়নি। মাইক্রোফোনের অনুমতি ও ইন্টারনেট পরীক্ষা করো।");
  try { rec.start(); } catch { alert("ভয়েস চালু করা যায়নি।"); }
}

/* ---------- History ---------- */
function closeHist() { $("hist").classList.remove("open"); }

async function newChat() {
  chatId = newId(); ls.set(LS_CHAT, chatId);
  current = []; renderChat(); closeHist();
}

async function openChat(cid) {
  chatId = cid; ls.set(LS_CHAT, cid);
  current = await getMsgs(cid);
  renderChat(); closeHist();
}

async function openHist() {
  $("hist").classList.add("open");
  const list = $("histList");
  list.textContent = "লোড হচ্ছে...";
  const all = await getAllMsgs();
  const map = {};
  all.forEach(m => {
    const c = map[m.chat_id] || (map[m.chat_id] = { cid: m.chat_id, title: "", last: "", n: 0 });
    c.n++;
    if (!c.title && m.role === "user") c.title = m.content;
    if (m.created_at > c.last) c.last = m.created_at;
  });
  const chats = Object.values(map).sort((a, b) => (a.last < b.last ? 1 : -1));
  list.textContent = "";
  if (!chats.length) { list.textContent = "এখনো কোনো ইতিহাস নেই।"; return; }
  chats.forEach(c => {
    const row = document.createElement("div"); row.className = "row";
    const open = document.createElement("button"); open.type = "button"; open.className = "open";
    const t = document.createElement("div"); t.className = "t"; t.textContent = c.title || "নতুন চ্যাট";
    const d = document.createElement("div"); d.className = "d";
    d.textContent = new Date(c.last).toLocaleDateString("bn-BD") + " · " + c.n + " মেসেজ";
    open.append(t, d);
    open.onclick = () => openChat(c.cid);
    const x = document.createElement("button"); x.type = "button"; x.className = "x"; x.textContent = "মুছো";
    x.onclick = async () => {
      if (!confirm("এই পুরো চ্যাটটি মুছবে?")) return;
      await deleteChat(c.cid);
      if (c.cid === chatId) { chatId = newId(); ls.set(LS_CHAT, chatId); current = []; renderChat(); }
      openHist();
    };
    row.append(open, x);
    list.appendChild(row);
  });
}

/* ---------- Menu ---------- */
function setVoiceLabel() { $("voiceItem").textContent = "কণ্ঠ: " + (voiceOn ? "চালু" : "বন্ধ"); }

$("menuBtn").addEventListener("click", e => { e.stopPropagation(); $("menu").classList.toggle("open"); });
document.addEventListener("click", () => $("menu").classList.remove("open"));

$("menu").addEventListener("click", async e => {
  const act = e.target.dataset && e.target.dataset.act;
  if (!act) return;
  $("menu").classList.remove("open");
  if (act === "new") newChat();
  else if (act === "hist") openHist();
  else if (act === "mem") {
    const l = await getMems();
    note(l.length ? "স্মৃতি:\n" + l.map((m, i) => (i + 1) + ". " + m.text).join("\n") : "এখনো কোনো স্মৃতি নেই।");
  }
  else if (act === "voice") { voiceOn = !voiceOn; ls.set(LS_VOICE, voiceOn); setVoiceLabel(); }
  else if (act === "tts") { const was = voiceOn; voiceOn = true; speak("হ্যালো! আমি আধিবা, তোমার ব্যক্তিগত সহকারী।"); voiceOn = was; }
  else if (act === "clearMem") { if (confirm("সব স্মৃতি মুছে ফেলবে?")) { await clearMems(); note("স্মৃতি মুছে ফেলা হয়েছে।"); } }
  else if (act === "clearAll") {
    if (confirm("সব চ্যাটের ইতিহাস মুছে ফেলবে?")) { await deleteAllChats(); chatId = newId(); ls.set(LS_CHAT, chatId); current = []; renderChat(); }
  }
});

/* ---------- Wire up ---------- */
$("send").addEventListener("click", send);
$("micBtn").addEventListener("click", startVoice);
$("msg").addEventListener("keydown", e => { if (e.key === "Enter") send(); });
$("histClose").addEventListener("click", closeHist);
$("histNew").addEventListener("click", newChat);
if ("speechSynthesis" in window) window.speechSynthesis.getVoices();
setVoiceLabel();

(async function init() {
  current = await getMsgs(chatId);
  renderChat();
})();
</script>
</body>
</html>
